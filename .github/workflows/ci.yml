# Runs on every pull request (and on pushes to master), so a PR shows
# whether it typechecks, lints, passes the tests and builds.
name: CI

on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:

# A new push to the same PR cancels the run that is still going.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NEXT_TELEMETRY_DISABLED: 1

# Runners are pinned rather than ubuntu-latest, which moves to Ubuntu 26 on
# 2026-10-19: the e2e job installs Playwright's system packages and runs
# Supabase in Docker. Move all three jobs together once a PR passes on the
# new image.
jobs:
  checks:
    name: Typecheck, lint & unit tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      # Next.js and Jest run on Node; match the Node major Vercel uses.
      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Lint
        run: bun run lint

      - name: Unit tests
        run: bun run test -- --ci

  build:
    name: Production build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    # The build needs no secrets: pages that query Supabase are rendered on
    # request, so placeholder values are enough to compile and prerender.
    env:
      NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder-anon-key
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-

      - uses: actions/cache@v6
        with:
          path: .next/cache
          key: next-${{ runner.os }}-${{ hashFiles('bun.lock') }}-${{ hashFiles('src/**') }}
          restore-keys: next-${{ runner.os }}-${{ hashFiles('bun.lock') }}-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build
        run: bun run build

  e2e:
    name: End-to-end tests (Playwright)
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Local Supabase (Docker) with the schema snapshot and seed in e2e/supabase.
      # Services the app does not use are skipped to save time.
      - name: Start Supabase test stack
        run: ./node_modules/.bin/supabase start --workdir e2e -x studio,imgproxy,edge-runtime,logflare,vector,supavisor,postgres-meta

      - name: Export test stack connection
        run: |
          ./node_modules/.bin/supabase status -o json --workdir e2e > "$RUNNER_TEMP/supabase.json"
          echo "Status keys: $(jq -r 'keys | join(", ")' "$RUNNER_TEMP/supabase.json")"
          {
            echo "E2E_SUPABASE_URL=$(jq -r .API_URL "$RUNNER_TEMP/supabase.json")"
            echo "E2E_SUPABASE_ANON_KEY=$(jq -r .ANON_KEY "$RUNNER_TEMP/supabase.json")"
            echo "E2E_SUPABASE_SERVICE_ROLE_KEY=$(jq -r .SERVICE_ROLE_KEY "$RUNNER_TEMP/supabase.json")"
            echo "E2E_DB_URL=$(jq -r .DB_URL "$RUNNER_TEMP/supabase.json")"
          } >> "$GITHUB_ENV"

      - name: Cache Playwright browsers
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('bun.lock') }}

      - name: Install Playwright browser
        run: bunx playwright install --with-deps chromium

      - name: Run end-to-end tests
        run: bun run test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 14

      - name: Supabase Auth logs
        if: failure()
        run: docker logs --tail 200 supabase_auth_closet-by-era-e2e || true
